apiVersion: v1
kind: Secret
metadata:
  name: travel-mcp-secrets
  namespace: travel-mcp
  labels:
    app.kubernetes.io/name: travel-mcp-secrets
    app.kubernetes.io/part-of: travel-langgraph-agent-mcp
type: Opaque
stringData:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
  DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN }}
  LANGGRAPH_POSTGRES_URI: ${{ secrets.LANGGRAPH_POSTGRES_URI }}

